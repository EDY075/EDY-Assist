name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: file:./prisma/ci.db
      APP_TIMEZONE: America/Sao_Paulo
      WHATSAPP_PROVIDER: mock
      HOST: 127.0.0.1
      PORT: 3333
      CORS_ORIGIN: http://127.0.0.1:5173
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://127.0.0.1:3333

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify isolated demo seed
        run: npm run demo:seed

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
