<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <title>EDY Assist — sem conexão</title>
    <style>
      :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#08090d;color:#f4f5fa}
      *{box-sizing:border-box}body{min-height:100dvh;margin:0;padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#33246c 0,transparent 38%),#08090d}
      main{width:min(100%,430px);padding:28px;border:1px solid #292b38;border-radius:22px;background:#11131bcc;box-shadow:0 24px 80px #0008}.mark{width:58px;height:58px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,#8d73ff,#22d3ee);font-size:27px;font-weight:800}
      h1{margin:22px 0 10px;font-size:26px;letter-spacing:-.04em}p{margin:0;color:#a6a9b7;line-height:1.65}button{width:100%;min-height:48px;margin-top:24px;border:0;border-radius:13px;background:#7c5cff;color:white;font:700 15px inherit;cursor:pointer}small{display:block;margin-top:16px;color:#777b8c;line-height:1.5}
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">E</div>
      <h1>EDY Assist está offline</h1>
      <p>O aplicativo abre sem rede, mas seus dados ficam no SQLite do computador. Para consultar ou salvar algo, mantenha o computador, a API e o túnel HTTPS ligados.</p>
      <button type="button" onclick="location.reload()">Tentar reconectar</button>
      <small>Nenhuma ação digitada foi enviada enquanto a conexão estava indisponível.</small>
    </main>
  </body>
</html>
